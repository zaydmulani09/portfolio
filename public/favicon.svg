<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#f5f5f3"/>
  <!-- Registration / crop-mark motif: corner ticks in ink -->
  <g fill="none" stroke="#17181b" stroke-width="2">
    <path d="M3 3 h7 M3 3 v7"/>
    <path d="M29 3 h-7 M29 3 v7"/>
    <path d="M3 29 h7 M3 29 v-7"/>
    <path d="M29 29 h-7 M29 29 v-7"/>
  </g>
  <!-- Single accent registration mark at center -->
  <rect x="14" y="14" width="4" height="4" fill="#d42a1c"/>
</svg>
