name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours. The page shows live stars, deploy state, and last-push
    # dates, so it goes stale on its own even when nothing here changes.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        env:
          # Supplied by Actions automatically. Raises the GitHub API limit
          # from 60 requests an hour to 5000.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo secret. If it is missing the build still succeeds and the
          # live table says so on the page instead of going blank.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: node build/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4
